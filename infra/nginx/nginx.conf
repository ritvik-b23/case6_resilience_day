events {
    worker_connections 1024;
}

http {
    upstream orders_upstream {
        server orders-service:8001;
    }

    upstream inventory_upstream {
        server inventory-service:8002;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward or generate X-Request-ID
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Route /orders and /orders/* to orders-service (path preserved)
        location /orders {
            proxy_pass http://orders_upstream;
        }

        # Route /inventory/* to inventory-service (path preserved)
        location /inventory/ {
            proxy_pass http://inventory_upstream;
        }

        # Convenience health check shortcuts
        location = /health/orders {
            proxy_pass http://orders_upstream/health;
        }

        location = /health/inventory {
            proxy_pass http://inventory_upstream/health;
        }
    }
}
